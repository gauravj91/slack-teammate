# Slack app manifest for Teammate.
# Create the app at https://api.slack.com/apps -> "Create New App" -> "From an app manifest",
# pick a workspace, paste this file, then replace:
#   your-app.vercel.app      -> your Vercel production domain
#   YOUR-PROJECT-REF         -> your Supabase project ref (Settings -> General)
# Rename "Teammate" below if you renamed the product.
display_information:
  name: Teammate
  description: An AI teammate that does the work in your tools and asks before it acts.
  background_color: "#4f46e5"
  long_description: >-
    Teammate is an AI teammate with its own Slack identity. Mention it in a channel or DM it, and it
    uses the tools your team connects (HubSpot, Gmail, Notion, Linear, Google Sheets and hundreds more),
    follows the playbooks you teach it, runs tasks on request or on a schedule, asks for approval before
    changing anything, and keeps an audit trail of every action.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Teammate
    always_online: true
oauth_config:
  redirect_urls:
    # "Add to Slack" install flow
    - https://your-app.vercel.app/api/slack/oauth
    # "Sign in with Slack" for the dashboard (Supabase Auth, Slack OIDC provider)
    - https://YOUR-PROJECT-REF.supabase.co/auth/v1/callback
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - chat:write.public
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
    user:
      # Only used for "Sign in with Slack" on the dashboard
      - openid
      - email
      - profile
settings:
  event_subscriptions:
    request_url: https://your-app.vercel.app/api/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - app_uninstalled
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://your-app.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
